[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "contentmaxxing"
version = "0.1.0"
description = "A portable, markdown-first creator operating system: Capture, Create, Compound."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["jsonschema>=4.18,<5", "PyYAML>=6,<7", "tzdata>=2024.1; platform_system == 'Windows'"]
license = "MIT"
license-files = ["LICENSE"]

[project.urls]
Repository = "https://github.com/perpy1/contentmaxxing"
Issues = "https://github.com/perpy1/contentmaxxing/issues"

[project.scripts]
contentmaxxing = "contentmaxxing.cli:main"

[tool.setuptools.packages.find]
include = ["contentmaxxing*"]

[tool.setuptools.package-data]
contentmaxxing = ["*.md", "skills/*/*.md", "skills/*/references/*.md", "schemas/*.json", "evals/*.json", "templates/*.md", "prompts/*.md", "commands/*.md", "config/*.yaml", "config/*.json", "assets/*.png", "assets/*.md"]
